<!-- src/app/components/password/password.component.html -->
<div class="form-container">
  <form (ngSubmit)="onSubmit()" #passwordForm="ngForm" novalidate>

    <h2> PASSWORD 🔐🗝️ </h2>

    <!-- Email -->
    <div class="input-group">
      <input
        type="email"
        placeholder="Votre email"
        [(ngModel)]="email"
        name="email"
        #emailCtrl="ngModel"
        required
        email
      />
      <div class="error" *ngIf="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched)">
        <small>Email invalide</small>
      </div>
    </div>

    <!-- Nouveau mot de passe -->
    <div class="input-group">
      <input
        type="password"
        placeholder="Nouveau mot de passe"
        [(ngModel)]="newPassword"
        name="newPassword"
        #newPasswordCtrl="ngModel"
        required
        minlength="6"
        (input)="updatePasswordStrength()"
      />
      <div class="error" *ngIf="newPasswordCtrl.invalid && (newPasswordCtrl.dirty || newPasswordCtrl.touched)">
        <small *ngIf="newPasswordCtrl.errors?.['required']">Mot de passe requis</small>
        <small *ngIf="newPasswordCtrl.errors?.['minlength']">Minimum 6 caractères</small>
      </div>

      <!-- Jauge de force -->
      <div class="password-strength" *ngIf="newPassword">
        <div class="strength-bar" [ngClass]="passwordStrength"></div>
        <small class="strength-text">{{ passwordStrengthText }}</small>
      </div>
    </div>

    <!-- Confirmer mot de passe -->
    <div class="input-group">
      <input
        type="password"
        placeholder="Confirmer le mot de passe"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        #confirmPasswordCtrl="ngModel"
        required
        [ngClass]="{ 'error-input': confirmPasswordCtrl.invalid && confirmPasswordCtrl.touched }"
      />
      <div class="error" *ngIf="confirmPasswordCtrl.invalid && confirmPasswordCtrl.touched">
        <small>Les mots de passe ne correspondent pas</small>
      </div>
    </div>

    <!-- Bouton -->
    <button
      type="submit"
      [disabled]="!passwordForm.form.valid || isLoading || newPassword !== confirmPassword"
      class="submit-btn"
    >
      {{ isLoading ? 'Mise à jour...' : 'Changer le mot de passe' }}
    </button>

    <!-- Messages -->
    <div class="success" *ngIf="successMessage">
      {{ successMessage }}
    </div>
    <div class="error-global" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Lien retour -->
    <div class="compte">
      <a routerLink="/connexion">Retour à la connexion</a>
    </div>

  </form>
</div>
